<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1740" viewBox="0 0 1280 1740" role="img" aria-labelledby="title desc"><title id="title">Health Journal — 受控 Agent 工作流</title><desc id="desc">患者原文先保存，读取上下文并检查紧急提示。DeepSeek 规划，代码核验后选择追问、结束本轮或生成摘要。患者核对后保存，就诊结果归档并供下次调用。A、B、X 标识跨区域的流程续接。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79695e"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8543c"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#3d3834}.title{font-size:32px;font-weight:600}.body{font-size:16px;fill:#70655c}.label{font-size:14px;fill:#746458}.node-title{font-size:21px;font-weight:600}.node-sub{font-size:15px;fill:#6c625a}.code{font-size:12px;letter-spacing:.6px;fill:#956f58}.edge{fill:none;stroke:#79695e;stroke-width:2;marker-end:url(#arrow);stroke-linejoin:round}.red{stroke:#a8543c;marker-end:url(#redArrow)}.connector{fill:#f2e5d8;stroke:#b58b6f;stroke-width:1.5}.badge{font-size:13px;font-weight:bold;fill:#8a573c}</style></defs><rect width="1280" height="1740" fill="#faf7f2"/><text x="64" y="66" class="title">Health Journal · 受控 Agent 工作流</text><text x="64" y="101" class="body">观察 → 规划 → 执行 → 核验 → 保存状态 · v1 · 总控 Agent + 专用工具</text><g id="input"><rect x="64" y="160" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="86" y="188" class="code">01 · OBSERVE / SAVE</text><text x="86" y="221" class="node-title">患者记录，先保存原文</text><text x="86" y="249" class="node-sub">建档 / 新症状 / 后续变化</text></g><g id="context"><rect x="480" y="160" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="502" y="188" class="code">02 · READ_CONTEXT</text><text x="502" y="221" class="node-title">读取本次上下文</text><text x="502" y="249" class="node-sub">档案 + 当前事件 + 选定历史</text></g><g id="safety"><rect x="896" y="160" width="320" height="120" rx="17" fill="#fbf0e8" stroke="#d9cec2"/><text x="918" y="188" class="code">03 · SAFETY_CHECK</text><text x="918" y="221" class="node-title">本地紧急提示检查</text><text x="918" y="249" class="node-sub">命中保守规则时优先提示求助</text></g><path d="M384 220H480" class="edge"/><path d="M800 220H896" class="edge"/><circle cx="70" cy="133" r="17" class="connector"/><text x="70" y="138" text-anchor="middle" class="badge">A</text><circle cx="486" cy="133" r="17" class="connector"/><text x="486" y="138" text-anchor="middle" class="badge">B</text><rect x="896" y="326" width="320" height="62" rx="13" fill="#f4dfd6"/><text x="916" y="352" class="node-sub">提示立即寻求专业帮助</text><text x="916" y="374" class="code">urgent · 不等模型，不作诊断</text><path d="M1216 220H1248V357H1216" class="edge red"/><text x="1210" y="310" class="label">命中</text><path d="M1056 280V300H848V350H224V420" class="edge"/><text x="616" y="340" class="label">未命中规则</text><g id="plan"><rect x="64" y="420" width="320" height="120" rx="17" fill="#edf0e6" stroke="#d9cec2"/><text x="86" y="448" class="code">04 · EXTRACT_AND_PLAN</text><text x="86" y="481" class="node-title">总控 Agent 提出下一步</text><text x="86" y="509" class="node-sub">DeepSeek：事实 + 缺失信息 + 动作</text></g><g id="verify"><rect x="480" y="420" width="320" height="120" rx="17" fill="#fbf0e8" stroke="#d9cec2"/><text x="502" y="448" class="code">05 · VERIFY_SOURCES</text><text x="502" y="481" class="node-title">代码核验计划与引用</text><text x="502" y="509" class="node-sub">原文精确匹配 / 目标匹配 / 白名单</text></g><g id="route"><rect x="896" y="420" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="918" y="448" class="code">06 · EXECUTE_TOOL</text><text x="918" y="481" class="node-title">调用获准的专用工具</text><text x="918" y="509" class="node-sub">只允许下方三种动作</text></g><path d="M384 480H480" class="edge"/><text x="391" y="465" class="label">结构化 JSON</text><path d="M800 480H896" class="edge"/><text x="810" y="465" class="label">校验通过</text><circle cx="362" cy="402" r="17" class="connector"/><text x="362" y="407" text-anchor="middle" class="badge">X</text><circle cx="778" cy="402" r="17" class="connector"/><text x="778" y="407" text-anchor="middle" class="badge">X</text><path d="M1056 540V610H224V690" class="edge"/><text x="247" y="600" class="label">缺少有用描述</text><path d="M1056 610H640V690" class="edge"/><text x="652" y="642" class="label">本轮足够</text><path d="M1056 610V690" class="edge"/><text x="1070" y="650" class="label">患者请求摘要</text><g id="question"><rect x="64" y="690" width="320" height="120" rx="17" fill="#edf0e6" stroke="#d9cec2"/><text x="86" y="718" class="code">ASK_FOLLOWUP · waiting_patient</text><text x="86" y="751" class="node-title">提出一个澄清问题</text><text x="86" y="779" class="node-sub">等待患者回答，下一次再运行</text></g><g id="finish"><rect x="480" y="690" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="502" y="718" class="code">FINISH_TRACKING · completed</text><text x="502" y="751" class="node-title">结束本轮记录</text><text x="502" y="779" class="node-sub">不重复提问；随时可以再记录</text></g><g id="brief"><rect x="896" y="690" width="320" height="120" rx="17" fill="#edf0e6" stroke="#d9cec2"/><text x="918" y="718" class="code">CREATE_BRIEF · waiting_review</text><text x="918" y="751" class="node-title">生成可编辑摘要</text><text x="918" y="779" class="node-sub">时间线、健康背景、已选历史</text></g><path d="M224 810V886" class="edge"/><path d="M1056 810V886" class="edge"/><g id="reply"><rect x="64" y="886" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="86" y="914" class="code">HUMAN · 答案属于患者</text><text x="86" y="947" class="node-title">患者补充 / 更正</text><text x="86" y="975" class="node-sub">新原文保存后再判断下一步</text></g><g id="review"><rect x="896" y="886" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="918" y="914" class="code">HUMAN · 审阅与决定</text><text x="918" y="947" class="node-title">患者逐字核对</text><text x="918" y="975" class="node-sub">可修改草稿；明确确认后才保存</text></g><path d="M224 1006V1050" class="edge"/><circle cx="224" cy="1068" r="17" class="connector"/><text x="224" y="1073" text-anchor="middle" class="badge">A</text><text x="251" y="1073" class="label">续接上方：先保存原文</text><path d="M1056 1006V1110" class="edge"/><text x="1070" y="1054" class="label">患者确认</text><g id="checkpoint"><rect x="896" y="1110" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="918" y="1138" class="code">SAVE_REVIEWED_BRIEF · completed</text><text x="918" y="1171" class="node-title">保存版本与来源快照</text><text x="918" y="1199" class="node-sub">记录审核完成；可 PDF / 复制 / 展示</text></g><path d="M1056 1230V1280" class="edge"/><text x="1070" y="1260" class="label">就诊之后</text><g id="visit"><rect x="896" y="1280" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="918" y="1308" class="code">CLINICIAN OUTCOME · 患者自行录入</text><text x="918" y="1341" class="node-title">患者录入就诊结果</text><text x="918" y="1369" class="node-sub">医生结论、处理方案、后续安排</text></g><g id="history"><rect x="480" y="1280" width="320" height="120" rx="17" fill="#ffffff" stroke="#d9cec2"/><text x="502" y="1308" class="code">MEMORY · 历史不是本次诊断</text><text x="502" y="1341" class="node-title">归档，供以后关联</text><text x="502" y="1369" class="node-sub">下次出现类似情况，由患者选用</text></g><path d="M896 1340H800" class="edge"/><text x="832" y="1325" class="label">归档</text><path d="M640 1400V1438" class="edge"/><circle cx="640" cy="1456" r="17" class="connector"/><text x="640" y="1461" text-anchor="middle" class="badge">B</text><text x="667" y="1461" class="label">续接上方：读取选定历史</text><rect x="64" y="1130" width="704" height="100" rx="17" fill="#f3e7df" stroke="#dbc8ba"/><circle cx="99" cy="1161" r="17" class="connector"/><text x="99" y="1166" text-anchor="middle" class="badge">X</text><text x="128" y="1168" class="node-title">校验失败、模型错误或服务中断</text><text x="88" y="1201" class="node-sub">保存安全错误与已完成步骤；原文不丢失。用户重试 → 新运行关联旧运行。</text><text x="64" y="1495" class="label">A / B / X 为跨区域续接标识；等待患者的节点不会在后台擅自继续。</text><rect x="64" y="1520" width="1152" height="170" rx="18" fill="#efece5"/><text x="88" y="1554" class="badge">统一运行合同</text><text x="88" y="1576" class="node-sub">runId · goal · sourceFingerprint · steps · status · output / error · parentRunId</text><text x="88" y="1598" class="badge">可靠性规则</text><text x="88" y="1620" class="node-sub">同源请求幂等；来源变化需重新核对；重启中断可重试；仅记录外部动作与结果。</text><text x="88" y="1642" class="badge">本代边界</text><text x="88" y="1664" class="node-sub">单机 SQLite，英文 / 中文；不作诊断，不自动发送；邮件及关机后定时服务尚未接入。</text></svg>